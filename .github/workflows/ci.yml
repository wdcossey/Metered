name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  AVALONIA_TELEMETRY_OPTOUT: 1

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Libraries target net8.0, but Avalonia 12's analyzers need a current Roslyn, and the tests
      # run on net10.0; global.json pins the SDK.
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Metered.sln

      - name: Build
        run: dotnet build Metered.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test Metered.sln --no-build --configuration Release --logger "trx" --results-directory TestResults

      # The fonts' package must carry both OFL notices and Base Web's (#31): a dropped licence fails here.
      - name: Pack the fonts and check their licences travel
        run: |
          dotnet pack src/Metered.Fonts --no-build --configuration Release --output pack
          entries=$(unzip -Z1 pack/Metered.Fonts.*.nupkg)
          missing=0
          for licence in fonts/InstrumentSans/OFL.txt fonts/Figtree/OFL.txt LICENSE-baseweb.txt; do
            grep -qxF "$licence" <<< "$entries" || { echo "::error::Metered.Fonts is missing $licence"; missing=1; }
          done
          exit $missing

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: TestResults

  # The Android head, in a job of its own: it needs the android workload, which build-test doesn't. Build only, so
  # the head can't break unnoticed; the device run is tools/android/run.ps1, on the maintainer's phone, and its
  # self-test (its parsers on fixtures, no device) runs here. From Cornflower's.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: The device run's self-test
        run: pwsh -NoProfile -File tools/android/run.ps1 -SelfTest

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # .NET for Android 10 supports JDK 17 and 21.
      - uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: 21

      - name: Install the android workload
        run: dotnet workload install android

      # The runner's Android SDK may lack the platform the workload targets; this fetches what is missing.
      - name: Install the Android SDK parts the build needs
        run: dotnet build samples/Metered.Sample.Android -t:InstallAndroidDependencies -f net10.0-android -p:AndroidSdkDirectory="$ANDROID_HOME" -p:AcceptAndroidSDKLicenses=true

      - name: Build the Android head
        run: dotnet build samples/Metered.Sample.Android --configuration Release -p:AndroidSdkDirectory="$ANDROID_HOME"

      # Debug too: its code differs (Avalonia's diagnostics, for the cost line run.ps1 -Configuration Debug reads).
      - name: Build the Android head, Debug
        run: dotnet build samples/Metered.Sample.Android --configuration Debug -p:AndroidSdkDirectory="$ANDROID_HOME"

  # The generated files are what the generators write today: the tokens and part themes from the
  # pinned baseui, and the oracle the tests read. Neither needs a browser (only
  # tools/reference/precedence.js does, and it is run by hand).
  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Base Web reference (npm)
        run: npm ci

      - name: Check the Node tools' syntax
        run: for f in $(git ls-files 'tools/*.js'); do node --check "$f"; done

      - name: The breakage tool kills its strays, never itself (Linux)
        run: node tools/breakage/strays.test.js

      # drive.ps1 itself needs Windows and a display, so CI checks it without a window: its helpers, the sizes it
      # expects against the sample, and the script as parsed.
      - name: The real-window driver's self-test
        run: pwsh -NoProfile -File tools/real-window/selftest.ps1

      - name: Tokens and part themes are up to date
        run: node tools/tokens/gen.js --check

      - name: Oracle is up to date
        run: node tools/reference/cases.js --check

  # drive.ps1 runs under Windows PowerShell 5.1 as well as pwsh 7, and helpers.ps1, which it loads, has to parse and work
  # under both. generated's Linux pwsh can't see 5.1-only breakage (a ?? or a ternary would pass there), so the self-test
  # runs here under each. Not a required check.
  real-window:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: The real-window driver's self-test, Windows PowerShell 5.1
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/real-window/selftest.ps1

      - name: The real-window driver's self-test, pwsh 7
        shell: pwsh
        run: pwsh -NoProfile -File tools/real-window/selftest.ps1
